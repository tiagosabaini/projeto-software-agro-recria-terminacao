<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Gestão de Lotes{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-marca">🐂 Recria &amp; Terminação</div>
        <button class="menu-mobile-btn" onclick="toggleMenu()">☰</button>
        <div class="navbar-links">
            <a href="{{ url_for('lotes') }}">Lotes</a>
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('cadastro') }}">Cadastro</a>
            <a href="{{ url_for('pesagem') }}">Pesagem</a>
            <a href="{{ url_for('gmd') }}">Consumo de Sal</a>
            <a href="{{ url_for('despesas') }}">Despesas</a>
            <a href="{{ url_for('painel') }}">Painel</a>

            <!-- Botão de Sair com o nome de quem está logado -->
            <a href="{{ url_for('logout') }}" style="color: var(--terracota-escuro); font-weight: bold; margin-left: 20px; border-left: 2px solid var(--borda); padding-left: 20px;">
                🚪 Sair ({{ session.get('nome_usuario') }})
            </a>
        </div>
    </nav>
    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
