<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Gestão de Lotes{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-marca">🐂 Recria &amp; Terminação</div>
        <div class="navbar-links">
            <a href="{{ url_for('index') }}">Início</a>
            <a href="{{ url_for('cadastro') }}">Cadastro</a>
            <a href="{{ url_for('despesas') }}">Despesas</a>
            <a href="{{ url_for('painel') }}">Painel</a>
            <a href="{{ url_for('pesagem') }}">Pesagem</a>
        </div>
    </nav>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
