{% extends "base.html" %}

{% block titulo %}Cadastro de Lote{% endblock %}

{% block conteudo %}
<h2>Cadastro de Novo Lote</h2>

<form action="{{ url_for('cadastro') }}" method="POST" class="form-caixa">
    <div class="campo">
        <label for="identificacao">Identificação do Lote:</label>
        <input type="text" id="identificacao" name="identificacao" placeholder="Ex: Lote 13 Bois Nelore" required>
    </div>

    <div class="campo">
        <label for="fase_atual">Fase Atual:</label>
        <select id="fase_atual" name="fase_atual" required>
            <option value="Recria">Recria</option>
            <option value="Terminação">Terminação</option>
        </select>
    </div>

    <div class="campo">
        <label for="data_inicio">Data de Entrada:</label>
        <input type="date" id="data_inicio" name="data_inicio" required>
    </div>

    <div class="campo">
        <label for="qtd_cabecas">Quantidade de Cabeças (Bezerros):</label>
        <input type="number" id="qtd_cabecas" name="qtd_cabecas" min="1" required>
    </div>

    <div class="campo">
        <label for="custo_bezerro_unitario">Valor Pago por Bezerro (R$):</label>
        <input type="number" id="custo_bezerro_unitario" name="custo_bezerro_unitario" step="0.01" min="0" required>
    </div>

    <button type="submit">Salvar Lote</button>
</form>

<a class="voltar" href="{{ url_for('index') }}">← Voltar para a página inicial</a>
{% endblock %}
