<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Pesagem - GMD</title>
</head>
<body>
    <h2>Registro de Pesagem e Cálculo do GMD</h2>

    <form method="POST" action="/pesagem">
        <div>
            <label for="peso_anterior">Peso Anterior (kg):</label><br>
            <input type="number" step="0.1" id="peso_anterior" name="peso_anterior" required>
        </div>
        <br>
        <div>
            <label for="peso_atual">Peso Atual (kg):</label><br>
            <input type="number" step="0.1" id="peso_atual" name="peso_atual" required>
        </div>
        <br>
        <div>
            <label for="dias">Dias Decorridos:</label><br>
            <input type="number" id="dias" name="dias" required>
        </div>
        <br>
        <button type="submit">Calcular GMD</button>
    </form>
</body>
</html>
