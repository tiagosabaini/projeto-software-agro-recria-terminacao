{% extends "base.html" %}
{% block titulo %}Editar Consumo de Sal{% endblock %}
{% block conteudo %}
<h2>Editar Registro de Consumo de Cocho</h2>
<form action="{{ url_for('editar_consumo', id=item.id) }}" method="POST" class="form-caixa">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="form-linha">
        <div class="campo">
            <label>Qtd Sacos:</label>
            <input type="number" step="0.1" name="qtd_sacos" value="{{ item.qtd_sacos }}" required>
        </div>
        <div class="campo">
            <label>Peso Saco (kg):</label>
            <input type="number" name="peso_saco_kg" value="{{ item.peso_saco_kg }}" required>
        </div>
        <div class="campo">
            <label>Dias de Duração:</label>
            <input type="number" name="dias" value="{{ item.dias }}" required>
        </div>
        <div class="campo">
            <label>Qtd Bois:</label>
            <input type="number" name="qtd_bois" value="{{ item.qtd_bois }}" required>
        </div>
    </div>

    <button type="submit">Atualizar Trato</button>
</form>
<a class="voltar" href="{{ url_for('consumo_cocho') }}">← Voltar</a>
{% endblock %}
